spring:
  profiles:
    active: dev
  application:
    name: fastchat

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.3-70b-versatile}
          temperature: ${TEMPERATURE:0.1}
          # Token allocation: file context ~1250, message ~1000, system ~100, history 500-1000, response ~7000
          max-tokens: ${MAX_TOKENS:7000}

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

  # Multipart file upload configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 1MB
      location: ${java.io.tmpdir}

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: on_param

# Keep Alive Service Configuration
app:
  url: ${APP_URL:http://localhost:8080}
  health-check:
    endpoint: ${APP_HEALTH_CHECK_ENDPOINT:/api/health}

  # File context engine configuration
  file-context:
    chunk-size: 500
    top-k-chunks: 10
    max-context-length: 5000
    supported-formats: txt,pdf,docx,md,markdown

cors:
  allowed-origins: ${cors.allowed-origins:http://localhost:5173,http://localhost:3000,https://fastchat-ten.vercel.app,https://fastchat-llm.vercel.app}
  allowed-methods: ${cors.allowed-methods:GET,POST,PUT,DELETE,OPTIONS}

logging:
  level:
    root: INFO
    org.springframework.jdbc.core: WARN
    com.rakeshgupta.fastchat_backend: DEBUG
